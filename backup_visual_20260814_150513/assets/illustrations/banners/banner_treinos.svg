<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B5DE5"/><stop offset="1" stop-color="#2A1055"/></linearGradient>
    <radialGradient id="s" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/><stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="bl"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="480" rx="40" fill="url(#g)"/>
  <g filter="url(#bl)" opacity="0.5">
    <circle cx="1000" cy="120" r="180" fill="#ffffff" opacity="0.18"/>
    <circle cx="150" cy="420" r="160" fill="#ffffff" opacity="0.12"/>
  </g>
  <rect width="1200" height="480" rx="40" fill="url(#s)"/>
  <text x="70" y="150" font-family="Poppins,Arial,sans-serif" font-weight="800" font-size="30"
        fill="#ffffff" opacity="0.85" letter-spacing="3">LILI FIT</text>
  <text x="70" y="250" font-family="Poppins,Arial,sans-serif" font-weight="800" font-size="72"
        fill="#FFFFFF">Treinos</text>
  <text x="72" y="315" font-family="Inter,Arial,sans-serif" font-size="30"
        fill="#ffffff" opacity="0.9">Treine no seu ritmo</text>
  <!-- espaço reservado p/ mascote Lili (PNG por cima, à direita) -->
  <g transform="translate(980,240)" opacity="0.9">
    <text font-size="150" text-anchor="middle" dominant-baseline="central">💪</text>
  </g>
  <text x="70" y="420" font-family="Inter,Arial,sans-serif" font-size="22" fill="#ffffff" opacity="0.6">Um dia de cada vez 💜</text>
</svg>
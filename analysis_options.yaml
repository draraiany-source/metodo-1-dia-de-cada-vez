include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
  exclude:
    - backup_nav_running_20260816/**
    - backup_visual_*/**
    - backup_assets_*/**
    - backup_icons_*/**
    - RECUPERACAO_PROJETO_COMPLETO/**
    - RELATORIO_ANALYZE_TMP.txt
    - build/**
    - .dart_tool/**
    # Pacote removido do pubspec para não entrar no release Android;
    # o teste de device fica fora do analyze até reintroduzir com cuidado.
    - integration_test/**
linter:
  rules:
    prefer_const_constructors: false
    avoid_print: false

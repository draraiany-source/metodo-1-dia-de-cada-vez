# Host ~7 GB RAM: keep heap modest to avoid native mmap OOM during bundleRelease.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dkotlin.daemon.jvm.options=-Xmx1024m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=2
android.useAndroidX=true

# AGP 9 defaults: new DSL + built-in Kotlin. Do NOT set android.newDsl=false /
# android.builtInKotlin=false — those force the deprecated BaseAppModuleExtension
# path and break Kotlin DSL script compilation.

flutter.minSdkVersion=23
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

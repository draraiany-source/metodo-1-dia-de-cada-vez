name: metodo_1_dia
description: "Método 1 Dia de Cada Vez — App fitness feminino premium."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ---- State management / routing ----
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # ---- Firebase ----
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.1

  # ---- Auth helpers ----
  google_sign_in: ^6.2.1

  # ---- Corrida / GPS ----
  geolocator: ^12.0.0
  # geocoding: ^3.0.0   # removido da build: nenhum import em lib/ (0 usos).
  #                       Reative se for exibir endereço/reverse-geocoding.
  # google_maps_flutter: ^2.7.0   # habilite ao configurar chave Google Maps

  # ---- UI / util ----
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.2
  # rive: ^0.13.20   # descomente para ativar animações Rive (.riv)
  url_launcher: ^6.3.0
  http: ^1.2.1

  # ---- Notificações locais ----
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # ---- Calendário ----
  table_calendar: ^3.1.2

  # ---- Cursos em áudio ----
  just_audio: ^0.9.40

  # ---- Receitas em PDF ----
  pdfx: ^2.6.0

  # ---- Geração de PDF (certificados, relatórios) ----
  pdf: ^3.10.8
  printing: ^5.13.1

  # ---- Compartilhamento nativo ----
  share_plus: ^10.0.2

  # ---- Streaming de vídeo ----
  video_player: ^2.9.2
  chewie: ^1.8.5
  path_provider: ^2.1.4

  # ---- Pagamentos (preparado) ----
  # purchases_flutter: ^6.29.0   # RevenueCat — habilite ao integrar

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# -----------------------------------------------------------------------------
# Ícone do app — gera pra Android/iOS a partir de 1 PNG 1024x1024 com fundo.
# PENDÊNCIA: exporte assets/app_icon/app_icon.svg como PNG 1024x1024
# (o SVG já existe; falta rasterizar — Figma/Illustrator/qualquer conversor).
# Depois rode: flutter pub run flutter_launcher_icons
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/app_icon/android_adaptive_foreground.png"
  remove_alpha_ios: true

# -----------------------------------------------------------------------------
# Splash screen nativa — mesma pendência: exportar o SVG como PNG antes.
# Depois rode: flutter pub run flutter_native_splash:create
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#111111"
  image: "assets/app_icon/app_icon.png"
  android_12:
    color: "#111111"
    image: "assets/app_icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons_3d/
    - assets/images/mascote/
    - assets/images/home/
    - assets/images/treinos/
    - assets/images/corrida/
    - assets/images/hidratacao/
    - assets/images/receitas/
    - assets/images/alimentacao/
    - assets/images/progresso/
    - assets/images/rotina/
    - assets/images/bem_estar/
    - assets/images/premium/
    - assets/images/comunidade/
    - assets/images/personal/
    - assets/images/lily_fit/
    - assets/images/referencias/
    - assets/mascot/png/
    - assets/mascot/extras/
    - assets/icons/
    - assets/content/
    - assets/animations/
    - assets/rive/
    - assets/avatars/
    - assets/stickers/
    - assets/badges/
    - assets/backgrounds/
    # assets/illustrations/ (raiz) não é declarada: não contém arquivos
    # diretamente, apenas a subpasta banners/ abaixo. Declarar uma pasta
    # vazia gera "No file or variants found for asset" no build.
    - assets/illustrations/banners/
    - assets/onboarding/
    - assets/loading/
    - assets/empty/
    - assets/success/
    - assets/error/
    - assets/premium/
    - assets/exercises/
    - assets/recipes/
    - assets/habits/
    - assets/challenges/
    - assets/app_icon/
